<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГДЗ UA</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
         :root {
            --bg: #1a1a1b;
            --panel: #272729;
            --accent: #0078d4;
            --text: #e8eaed;
        }
        
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
        }
        
        aside {
            width: 300px;
            background: var(--panel);
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .logo {
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            border-bottom: 1px solid #3e3e42;
        }
        
        .menu-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .grade-section {
            margin-bottom: 10px;
        }
        
        .grade-title {
            width: 100%;
            padding: 12px;
            background: #333;
            border: none;
            color: white;
            text-align: left;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        
        .type-group {
            display: none;
            padding-left: 10px;
            margin-top: 5px;
        }
        
        .type-title {
            padding: 5px 10px;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-top: 10px;
        }
        
        .book-item {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        
        .book-item:hover {
            background: var(--accent);
            color: white;
        }
        /* Основная часть */
        
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .ad-top {
            height: 90px;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .content-area {
            padding: 20px;
        }
        
        .frame-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            opacity: 0.5;
        }
        
        footer a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>

<body>

    <aside>
        <div class="logo">ГДЗ UA</div>
        <div class="menu-scroll" id="main-menu">
        </div>
    </aside>

    <main>
        <div class="ad-top">
            <div style="color: #444;">ADSENSE PLACEHOLDER</div>
        </div>

        <div class="content-area">
            <div id="viewer-placeholder" style="text-align: center; margin-top: 100px;">
                <h1>Выберите учебник</h1>
                <p>Используйте меню слева для навигации по базе ГДЗ</p>
            </div>

            <div id="book-viewer" style="display: none;">
                <div class="com-content-article item-page">
                    <div class="frame-wrapper">
                        <div id="iframe-container" style="position: relative; padding-top: max(60%,650px); height: 0; width: 100%;">
                        </div>
                    </div>
                    <div class="frame-links" style="margin-top: 15px; font-size: 11px; opacity: 0.4; word-break: break-all;">
                        <span id="current-url"></span>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <a href="#">Privacy Policy</a> | <a href="#">About Us</a> | <a href="#">Contact</a>
        </footer>
    </main>

    <script>
        const library = [{
            grade: 7,
            type: "ГДЗ",
            title: "Укр. Мова (Заболотный) 2024",
            id: "zabolotnyi-ukr-mova-7-2024",
            user: "kreidaros"
        }, {
            grade: 7,
            type: "ГДЗ",
            title: "ГДЗ Хімія 7 клас Григорович 2024",
            id: "hdz-khimiia-7-klas-hrygorovych-2024",
            user: "kreidaros"
        }, {
            grade: 7,
            type: "ГДЗ",
            title: "ГДЗ Зарубіжна література 7 клас Ніколенко 2024",
            id: "hdz-zarubizhna-literatura-7-klas-nikolenko-2024",
            user: "kreidaros"
        }, {
            grade: 7,
            type: "ГДЗ",
            title: "ГДЗ Фізика 7 клас Бар’яхтар 2024",
            id: "hdz-fizyka-7-klas-barjakhtar-2024",
            user: "kreidaros"
        }, {
            grade: 7,
            type: "ГДЗ",
            title: "ГДЗ Біологія 7 клас Балан 2024",
            id: "hdz-biolohija-7-klas-balan-2024",
            user: "kreidaros"
        }, {
            grade: 7,
            type: "ГДЗ",
            title: "ГДЗ Українська література 7 клас Заболотний 2024",
            id: "hdz-ukrainska-literatura-7-klas-zabolotnyi-2024",
            user: "kreidaros"
        }, {
            grade: 7,
            type: "ГДЗ",
            title: "ГДЗ Географія 7 клас Гільберг 2024",
            id: "hdz-heohrafija-7-klas-hilberh-2024",
            user: "kreidaros"
        }, {
            grade: 7,
            type: "ГДЗ",
            title: "ГДЗ Всесвітня історія 7 клас Пометун 2024",
            id: "hdz-vsesvitnia-istoriia-7-klas-pometun-2024",
            user: "kreidaros"
        }, {
            grade: 7,
            type: "ГДЗ",
            title: "ГДЗ Історія України 7 клас Пометун 2024",
            id: "hdz-istoriia-ukrainy-7-klas-pometun-2024",
            user: "kreidaros"
        }, {
            grade: 7,
            type: "ГДЗ",
            title: "ГДЗ Геометрія 7 клас Істер 2024",
            id: "_7_2024_1e13731b94cae1",
            user: "kreidaros"
        }, {
            grade: 7,
            type: "ГДЗ",
            title: "ГДЗ Англійська мова 7 клас Мітчелл 2024",
            id: "mitchell-english-7-2024",
            user: "kreidaros"
        }];

        function initMenu() {
            const menu = $('#main-menu');
            const grades = [...new Set(library.map(item => item.grade))].sort((a, b) => a - b);

            grades.forEach(grade => {
                let gradeHtml = `
                <div class="grade-section">
                    <button class="grade-title" onclick="$(this).next().slideToggle(200)">${grade} КЛАСС</button>
                    <div class="type-group">`;
                const types = [...new Set(library.filter(i => i.grade === grade).map(i => i.type))];

                types.forEach(type => {
                    gradeHtml += `<div class="type-title">${type}</div>`;
                    library.filter(i => i.grade === grade && i.type === type).forEach(book => {
                        gradeHtml += `<div class="book-item" onclick="openBook('${book.id}', '${book.user}')">${book.title}</div>`;
                    });
                });

                gradeHtml += `</div></div>`;
                menu.append(gradeHtml);
            });
        }

        function openBook(id, user) {
            $('#viewer-placeholder').hide();
            $('#book-viewer').show();

            const url = `https://e.issuu.com/embed.html?d=${id}&pageLayout=singlePage&u=${user}`;

            $('#iframe-container').html(`
            <iframe allow="clipboard-write" 
                    sandbox="allow-top-navigation allow-top-navigation-by-user-activation allow-downloads allow-scripts allow-same-origin allow-popups" 
                    allowfullscreen="allowfullscreen" 
                    style="position: absolute; border: none; width: 100%; height: 100%; left: 0; right: 0; top: 0; bottom: 0;"
                    src="${url}" 
                    width="100%" height="100%">
            </iframe>
        `);
            $('#current-url').text(url);
        }

        $(document).ready(initMenu);
    </script>

</body>

</html>
